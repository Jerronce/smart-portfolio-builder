<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Portfolio Builder</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#07111f;color:#f8fafc}main{max-width:1160px;margin:auto;padding:44px 20px}.hero{margin-bottom:26px}.badge{display:inline-block;color:#7dd3fc;border:1px solid #ffffff22;border-radius:999px;padding:8px 12px;background:#ffffff0d;font-weight:800}h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.06em;line-height:.95;margin:16px 0}p{color:#9fb0c7;font-size:18px;line-height:1.6}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:28px;padding:22px;box-shadow:0 24px 80px #0007}label{display:block;margin:12px 0 7px;color:#cbd5e1;font-weight:800}input,textarea{width:100%;border:1px solid #334155;background:#020617;color:white;border-radius:16px;padding:13px;font-size:15px}textarea{min-height:90px}button{margin-top:14px;border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,#38bdf8,#22c55e);font-weight:900;color:#061014;cursor:pointer}.preview{background:#f8fafc;color:#0f172a;border-radius:28px;padding:28px}.preview h2{font-size:42px;letter-spacing:-.04em;margin:0}.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.chip{background:#e0f2fe;color:#075985;border-radius:999px;padding:9px 12px;font-weight:800}.project{border:1px solid #e2e8f0;border-radius:20px;padding:16px;margin:12px 0;background:white}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><span class="badge">Personal Brand Tool</span><h1>Smart Portfolio Builder</h1><p>Type profile details and instantly generate a clean portfolio preview for a developer or designer.</p></section><section class="grid"><div class="card"><label>Name</label><input id="name" value="Jerry Adedurin"><label>Title</label><input id="title" value="AI Engineer & Product Designer"><label>Bio</label><textarea id="bio">I build practical AI products, polished interfaces, and web tools that make complex work feel simple.</textarea><label>Skills, comma separated</label><input id="skills" value="AI Engineering, UI/UX, JavaScript, Product Design"><label>Projects, comma separated</label><input id="projects" value="PraeHire AI, Farad Logistics, PraeChat AI"><button onclick="build()">Build portfolio</button></div><div class="card"><div class="preview"><h2 id="pname"></h2><h3 id="ptitle"></h3><p id="pbio"></p><div class="chips" id="pskills"></div><h3>Selected Projects</h3><div id="pprojects"></div></div></div></section></main><script>function build(){pname.textContent=name.value;ptitle.textContent=title.value;pbio.textContent=bio.value;pskills.innerHTML=skills.value.split(',').map(s=>`<span class="chip">${s.trim()}</span>`).join('');pprojects.innerHTML=projects.value.split(',').map(p=>`<div class="project"><b>${p.trim()}</b><p>High-impact portfolio project with product thinking and clean execution.</p></div>`).join('')}build()</script></body></html>
